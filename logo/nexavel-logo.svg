<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E23636"/>
      <stop offset="50%" style="stop-color:#2B3784"/>
      <stop offset="100%" style="stop-color:#E23636"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Web icon -->
  <g transform="translate(30, 30)">
    <circle cx="30" cy="30" r="28" fill="none" stroke="url(#grad)" stroke-width="2.5"/>
    <circle cx="30" cy="30" r="20" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.6"/>
    <circle cx="30" cy="30" r="12" fill="none" stroke="url(#grad)" stroke-width="1" opacity="0.4"/>
    <line x1="30" y1="2" x2="30" y2="58" stroke="url(#grad)" stroke-width="1.5" opacity="0.7"/>
    <line x1="2" y1="30" x2="58" y2="30" stroke="url(#grad)" stroke-width="1.5" opacity="0.7"/>
    <line x1="10" y1="10" x2="50" y2="50" stroke="url(#grad)" stroke-width="1" opacity="0.5"/>
    <line x1="50" y1="10" x2="10" y2="50" stroke="url(#grad)" stroke-width="1" opacity="0.5"/>
    <line x1="6" y1="20" x2="54" y2="40" stroke="url(#grad)" stroke-width="0.8" opacity="0.4"/>
    <line x1="54" y1="20" x2="6" y2="40" stroke="url(#grad)" stroke-width="0.8" opacity="0.4"/>
    <!-- Spider body -->
    <ellipse cx="30" cy="30" rx="4" ry="5" fill="url(#grad)"/>
    <!-- Spider legs -->
    <line x1="26" y1="26" x2="18" y2="18" stroke="url(#grad)" stroke-width="1.5"/>
    <line x1="34" y1="26" x2="42" y2="18" stroke="url(#grad)" stroke-width="1.5"/>
    <line x1="26" y1="34" x2="18" y2="42" stroke="url(#grad)" stroke-width="1.5"/>
    <line x1="34" y1="34" x2="42" y2="42" stroke="url(#grad)" stroke-width="1.5"/>
    <line x1="28" y1="25" x2="22" y2="14" stroke="url(#grad)" stroke-width="1"/>
    <line x1="32" y1="25" x2="38" y2="14" stroke="url(#grad)" stroke-width="1"/>
    <line x1="28" y1="35" x2="22" y2="46" stroke="url(#grad)" stroke-width="1"/>
    <line x1="32" y1="35" x2="38" y2="46" stroke="url(#grad)" stroke-width="1"/>
  </g>

  <!-- NEXAVEL text -->
  <text x="85" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#1a1a2e" letter-spacing="2">NEXAVEL</text>
  <text x="85" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="none" stroke="url(#grad)" stroke-width="0.5" letter-spacing="2" opacity="0.3">NEXAVEL</text>

  <!-- Tagline -->
  <text x="88" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#666" letter-spacing="4">DIGITAL AGENCY</text>

  <!-- Accent line -->
  <line x1="88" y1="80" x2="200" y2="80" stroke="url(#grad)" stroke-width="2" stroke-linecap="round"/>
</svg>